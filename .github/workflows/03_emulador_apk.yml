name: 03 · Correr o APK num emulador Android

# Porque este workflow existe
# ---------------------------
# O APK foi compilado e verificado por fora (aapt2, apksigner, strings no DEX),
# mas nunca foi *executado*. O sandbox de desenvolvimento não tem /dev/kvm nem
# rede para dl.google.com, por isso não há emulador lá. O runner do GitHub tem
# ambos — é o único sítio onde "correr no telemóvel" pode ser provado.
#
# O que este job produz, como prova:
#   - screenshots reais das 5 abas, tiradas com `adb exec-out screencap`;
#   - logcat completo;
#   - o log do backend, mostrando os pedidos que a app fez de verdade;
#   - tabela de verificações (arranque, crash, WebSocket, leituras).
#
# Não substitui um telemóvel físico: biometria e comportamento em Wi-Fi real
# continuam por testar. Diz-se no relatório, não se finge.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Endereço que o APK deve usar (por omissão, 10.0.2.2:8000 do emulador)"
        required: false
        default: "http://10.0.2.2:8000"

permissions:
  contents: write

concurrency:
  group: emulador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------------
      # Backend: cinco pacotes chegam (medido: 65 rotas carregam).
      # ------------------------------------------------------------------
      - name: Instalar dependências do backend
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet fastapi==0.115.6 uvicorn==0.34.0 \
            pydantic==2.10.4 pyyaml httpx

      - name: Subir o backend
        run: |
          set -euo pipefail
          export API_ACCESS_TOKEN=token-do-emulador
          export PYTHONPATH="$GITHUB_WORKSPACE"
          nohup python3 -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "backend pronto em ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | head -c 300
          echo

      # ------------------------------------------------------------------
      # APK: usa o do último build (ramo apk-artifact), ou constrói um.
      # ------------------------------------------------------------------
      - name: Obter o APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk
          if git fetch --depth=1 origin apk-artifact 2>/dev/null; then
            git show FETCH_HEAD:app-debug.apk > /tmp/apk/app-debug.apk
            echo "APK do ramo apk-artifact"
          else
            echo "::warning::sem ramo apk-artifact; a construir"
            echo "construir=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -s /tmp/apk/app-debug.apk ]; then
            ls -lh /tmp/apk/app-debug.apk
            sha256sum /tmp/apk/app-debug.apk
          fi

      - name: Construir o APK se não houver
        if: steps.apk.outputs.construir == 'true'
        working-directory: android_apk
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.base_url }}"
          gradle :app:assembleDebug --no-daemon \
            -Pautomaton.baseUrl="$URL" -Pautomaton.token="token-do-emulador"
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk/app-debug.apk

      # ------------------------------------------------------------------
      # Emulador: KVM disponível, imagem x86_64 descarregada do Google.
      # ------------------------------------------------------------------
      - name: Activar KVM
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-kvm cpu-checker
          sudo chmod 666 /dev/kvm
          kvm-ok || true

      - name: Correr a app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            bash scripts/ci_emulator_smoke.sh /tmp/apk/app-debug.apk "$GITHUB_WORKSPACE/saida_emulador"

      - name: Publicar as provas num ramo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          DIR=saida_emulador
          if [ ! -d "$DIR" ]; then echo "sem saída"; exit 0; fi
          mkdir -p /tmp/ev && cd /tmp/ev
          git init -q -b emulador-evidencias
          cp -r "$GITHUB_WORKSPACE/$DIR/." .
          rm -f adb.log.bak
          {
            echo "# Prova de execução no emulador"
            echo
            echo "run: ${{ github.run_id }} · commit: ${{ github.sha }}"
            echo "APK: $(sha256sum app-debug.apk 2>/dev/null | cut -d' ' -f1 || echo '—')"
            echo
            [ -f RELATORIO.md ] && cat RELATORIO.md
          } > README.md
          ls -la
          git add -A
          git -c user.email=ci@automaton -c user.name=ci commit -q -m "evidências do run ${{ github.run_id }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" emulador-evidencias
          echo "evidências no ramo emulador-evidencias"

      - name: Resumo
        if: always()
        run: |
          if [ -f saida_emulador/RELATORIO.md ]; then
            cat saida_emulador/RELATORIO.md >> "$GITHUB_STEP_SUMMARY"
          fi
