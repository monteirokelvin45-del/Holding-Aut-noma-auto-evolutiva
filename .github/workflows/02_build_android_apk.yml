# =============================================================================
# Build do APK Android (Kotlin + Jetpack Compose).
#
# Produz:
#   * app-debug.apk    (sempre, para testes)
#   * app-release.apk  (assinado, se os segredos de keystore existirem)
#
# Segredos necessários para release:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#   AUTOMATON_BASE_URL, AUTOMATON_API_TOKEN
# =============================================================================
name: 02 · Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android_apk/**"
      - ".github/workflows/02_build_android_apk.yml"
  pull_request:
    paths:
      - "android_apk/**"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL do backend a fixar no APK (https://... ou http://10.0.2.2:8000 para o emulador)"
        required: false
        default: ""

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write      # publicar o APK num ramo (ver passo final)
  pull-requests: write
  issues: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle trata de cache; quando recebe gradle-version também
      # instala — mas só em cache miss, o que tornava o passo seguinte
      # dependente de um detalhe invisível. O Gradle passa a ser descarregado
      # explicitamente de services.gradle.org (rede aberta no runner), de
      # forma determinística e verificável com --version.
      - name: Instalar Gradle 8.10.2
        run: |
          set -euo pipefail
          VERSION=8.10.2
          URL="https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip"
          echo "A descarregar $URL"
          curl -fsSL --retry 3 --retry-delay 2 "$URL" -o /tmp/gradle.zip
          ls -lh /tmp/gradle.zip
          sudo mkdir -p /opt/gradle && sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${VERSION}/bin" >> "$GITHUB_PATH"
          export PATH="/opt/gradle/gradle-${VERSION}/bin:$PATH"
          gradle --version

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Aceitar licenças do Android SDK
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # Não se gera o wrapper: o Gradle já está instalado e verificado no passo
      # anterior. Gerar o wrapper era um passo extra que podia falhar por
      # motivos próprios (resolução de plugins na fase de configuração) e
      # obscurecia o erro real. Se o repositório trouxer ./gradlew, usa-se.
      - name: Escolher comando Gradle
        id: gradle
        run: |
          set -euo pipefail
          if [ -x android_apk/gradlew ]; then
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
            echo "Wrapper do repositório encontrado."
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
            echo "Sem wrapper: usa a distribuição instalada ($(gradle --version | awk '/^Gradle/{print $2}'))."
          fi

      - name: Preparar keystore de release
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android_apk
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Keystore de release disponível."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem keystore: apenas o APK de debug será assinado."
          fi

      - name: Resolver URL do backend
        id: backend
        env:
          SECRET_URL: ${{ secrets.AUTOMATON_BASE_URL }}
          INPUT_URL: ${{ github.event.inputs.base_url }}
        run: |
          set -euo pipefail
          # Prioridade: input manual > segredo do repositório.
          # Não há valor por omissão: um APK a apontar para um domínio que não
          # existe falha em runtime com "erro de rede" e ninguém descobre porquê.
          BASE_URL="${INPUT_URL:-${SECRET_URL:-}}"
          if [ -z "$BASE_URL" ]; then
            # Sem URL configurada, o debug fica com o alias do emulador
            # (10.0.2.2:8000) que o build.gradle.kts já usa por omissão.
            # O release NÃO é tentado: um APK de produção a apontar para o
            # emulador seria inútil e passaria despercebido.
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem AUTOMATON_BASE_URL. Debug aponta para 10.0.2.2:8000; release vai ser saltado."
          else
            echo "url=$BASE_URL" >> "$GITHUB_OUTPUT"
            echo "APK vai apontar para: $BASE_URL"
          fi

      - name: Definir URL usada no build
        id: buildurl
        env:
          CONFIGURED: ${{ steps.backend.outputs.url }}
        run: |
          set -euo pipefail
          # Sem segredo configurado, o debug aponta para o emulador. O
          # build.gradle.kts já tem esse valor por omissão, mas aqui a variável
          # fica explícita para não se passar uma string vazia ao -P.
          if [ -n "$CONFIGURED" ]; then
            echo "url=$CONFIGURED" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://10.0.2.2:8000" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug
        working-directory: android_apk
        env:
          AUTOMATON_API_TOKEN: ${{ secrets.AUTOMATON_API_TOKEN }}
        run: |
          set -euo pipefail
          ${{ steps.gradle.outputs.cmd }} :app:assembleDebug --no-daemon --stacktrace \
            -Pautomaton.baseUrl="${{ steps.buildurl.outputs.url }}" 2>&1 | tee -a build.log

      - name: Definir aptidão do release
        id: release_ok
        env:
          KEYSTORE_OK: ${{ steps.keystore.outputs.available }}
          CONFIGURED: ${{ steps.backend.outputs.url }}
        run: |
          set -euo pipefail
          # Um release só faz sentido se tiver keystore E URL real do backend.
          if [ "$KEYSTORE_OK" = "true" ] && [ -n "$CONFIGURED" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            [ "$KEYSTORE_OK" = "true" ] \
              && echo "::warning::Com keystore mas sem AUTOMATON_BASE_URL: release saltado." \
              || true
          fi

      # A injecção tem de correr ANTES da configuração do Gradle: append ao
      # build.gradle.kts depois de o Gradle já ter lido o ficheiro não tem
      # efeito nenhum.
      - name: Injetar configuração de assinatura
        if: ${{ steps.release_ok.outputs.ok == 'true' }}
        working-directory: android_apk
        run: |
          set -euo pipefail
          cat >> app/build.gradle.kts <<'KTS'

          // Assinatura injectada pelo CI (não commitar credenciais).
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../release.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD") ?: ""
                      keyAlias = System.getenv("KEY_ALIAS") ?: ""
                      keyPassword = System.getenv("KEY_PASSWORD") ?: ""
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          KTS

      - name: Build release (assinado)
        if: ${{ steps.release_ok.outputs.ok == 'true' }}
        working-directory: android_apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ${{ steps.gradle.outputs.cmd }} :app:assembleRelease --no-daemon --stacktrace \
            -Pautomaton.baseUrl="${{ steps.buildurl.outputs.url }}" 2>&1 | tee -a build.log

      - name: Correr testes unitários
        working-directory: android_apk
        run: |
          set -euo pipefail
          # Antes este passo tinha "|| echo warning", o que transformava uma
          # falha real de testes num aviso verde. Sem testes definidos, o Gradle
          # devolve sucesso; se houver testes e falharem, o build falha.
          ${{ steps.gradle.outputs.cmd }} :app:testDebugUnitTest --no-daemon 2>&1 | tee -a build.log

      - name: Localizar e renomear APKs
        id: apks
        run: |
          set -euo pipefail
          DEBUG_APK=$(find android_apk/app/build/outputs/apk/debug -name "*.apk" | head -1 || true)
          RELEASE_APK=$(find android_apk/app/build/outputs/apk/release -name "*.apk" | head -1 || true)
          mkdir -p dist
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" dist/app-debug.apk
            echo "debug=dist/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" dist/app-release.apk
            echo "release=dist/app-release.apk" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist || true

      - name: Publicar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: automaton-holding-debug-apk
          path: dist/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publicar APK de release
        if: ${{ steps.release_ok.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: automaton-holding-release-apk
          path: dist/app-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Anexar APK à release (em tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.release_ok.outputs.ok == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-debug.apk
          generate_release_notes: true

      # Os logs do Actions são servidos de *.blob.core.windows.net, que nem
      # sempre é alcançável a partir de fora. O erro fica também num comentário
      # do PR, que é legível por API em qualquer lado.
      # O APK vive num artefacto em *.blob.core.windows.net, inalcançável a
      # partir de algumas redes. Em vez de confiar que "ficou lá", o runner
      # inspecciona o binário que produziu e publica as provas no PR.
      - name: Verificar o APK gerado
        id: verificar
        run: |
          # Reescrito sem blocos `{ ... }`, sem arrays e sem pipefail: o
          # construto anterior morria a meio sem mensagem. Só appends simples,
          # para o que falhar ser sempre visível. Nenhum comando pode abortar
          # o passo (a evidência vale mais do que o ✅).
          APK=android_apk/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OUT=/tmp/apk_evidence.md
          TRACE=/tmp/verif_trace.log
          : > "$OUT"; : > "$TRACE"

          echo "APK: $(ls -lh "$APK" 2>&1 | head -1)" | tee -a "$TRACE"
          if [ ! -f "$APK" ]; then
            echo "::error::Nenhum APK de debug em $APK"
            exit 1
          fi

          echo "### APK de debug produzido" >> "$OUT"
          echo "" >> "$OUT"
          echo "| Propriedade | Valor |" >> "$OUT"
          echo "|---|---|" >> "$OUT"
          echo "| Ficheiro | \`app-debug.apk\` |" >> "$OUT"
          echo "| Tamanho | $(du -h "$APK" | cut -f1) ($(stat -c %s "$APK") bytes) |" >> "$OUT"
          echo "| sha256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |" >> "$OUT"
          echo "" >> "$OUT"

          echo "**Identidade (aapt2):**" >> "$OUT"
          echo '```' >> "$OUT"
          "$BT/aapt2" dump badging "$APK" 2>>"$TRACE" \
            | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:|uses-permission" \
            | head -14 >> "$OUT" 2>>"$TRACE"
          echo '```' >> "$OUT"

          echo "**Assinatura (apksigner):**" >> "$OUT"
          echo '```' >> "$OUT"
          "$BT/apksigner" verify --print-certs "$APK" 2>>"$TRACE" | head -5 >> "$OUT" 2>>"$TRACE"
          echo '```' >> "$OUT"

          echo "**Conteúdo do classes.dex:**" >> "$OUT"
          echo '```' >> "$OUT"
          # Um APK moderno tem vários DEX (classes.dex, classes2.dex, ...). Ler
          # só o primeiro deu "classes da app: 0" e uma URL que não é nossa —
          # prova de que o código da app estava noutro ficheiro.
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex 2>>"$TRACE"
          cat /tmp/dex/classes*.dex > /tmp/alldex.bin 2>>"$TRACE"
          echo "ficheiros DEX: $(ls /tmp/dex | wc -l) ($(du -h /tmp/alldex.bin | cut -f1))" >> "$OUT"
          echo "classes da app: $(strings /tmp/alldex.bin | grep -c 'Lcom/automaton/holding')" >> "$OUT"

          # Prova decisiva: as strings que o BuildConfig injetou.
          echo "BASE_URL e API_TOKEN em BuildConfig (constantes literais no DEX):" >> "$OUT"
          strings /tmp/alldex.bin \
            | grep -E '^(https?://10\.0\.2\.2:8000|https?://[a-z0-9.-]+\.[a-z]{2,})(/.*)?$' \
            | grep -v 'android\|google\|schemas\|kotlin\|okhttp\|square\|json-schema' \
            | sort -u | head -8 >> "$OUT"
          echo "endpoints e nomes de campos:" >> "$OUT"
          strings /tmp/alldex.bin | grep -E '^/(health|treasury|approvals|squads|agents|governance|validation|kill-switch|cycle/run|ws/live)' | sort -u | head -12 >> "$OUT"
          strings /tmp/alldex.bin | grep -E 'X-Automaton-Token|biometric_verified|KILL_SWITCH|amount_usd' | sort -u | head -8 >> "$OUT"
          echo '```' >> "$OUT"

          TOTAL=$(grep -rho '<testcase' android_apk/app/build/test-results 2>/dev/null | wc -l)
          FALHAS=$(grep -rho '<failure' android_apk/app/build/test-results 2>/dev/null | wc -l)
          echo "" >> "$OUT"
          echo "**Testes unitários:** ${TOTAL} casos, ${FALHAS} falhas" >> "$OUT"
          if [ "$TOTAL" -gt 0 ]; then
            echo '```' >> "$OUT"
            grep -rho 'testcase name="[^"]*"' android_apk/app/build/test-results 2>/dev/null \
              | sed 's/.*name="//; s/"$//' | sort >> "$OUT"
            echo '```' >> "$OUT"
          fi

          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
          echo "=== evidência ==="
          cat "$OUT"

      # O artefacto do Actions vive em *.blob.core.windows.net, que algumas
      # redes (incluindo a do ambiente de desenvolvimento) não alcançam. Um
      # ramo do repositório é servido por github.com, que é universalmente
      # acessível. O ramo é reescrito a cada build (force-push de um commit
      # órfão), por isso não acumula histórico.
      - name: Depositar o APK num ramo do repositório
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK=android_apk/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK ausente"; exit 1; }
          PUB=/tmp/apk_publicado
          rm -rf "$PUB"; mkdir -p "$PUB"
          cp "$APK" "$PUB/app-debug.apk"
          ( cd "$PUB"
            git init -q -b apk-artifact
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            sha256sum app-debug.apk > SHA256SUMS
            {
              echo "APK de debug gerado automaticamente pelo workflow 02."
              echo
              echo "Commit de origem: ${SHA}"
              echo "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "Este ramo é reescrito (force-push) a cada build; não versionar nada aqui."
            } > README.md
            git add -A
            git commit -q -m "apk-debug: ${SHA:0:12}"
            git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" apk-artifact
          )
          echo "APK publicado no ramo apk-artifact"

      - name: Publicar evidência do APK no PR
        if: ${{ success() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          gh pr comment "$PR" --body-file /tmp/apk_evidence.md \
            || echo "aviso: não foi possível comentar no PR"

      - name: Publicar diagnóstico no PR
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          RELATORIO=$(mktemp)
          {
            echo "### Build do APK falhou"
            echo
            echo '```'
            if [ -f /tmp/verif_trace.log ]; then
              echo "### Trace do passo \"Verificar o APK\""
              echo '```'
              tail -40 /tmp/verif_trace.log
              echo '```'
              echo
            fi
            if [ -f android_apk/build.log ]; then
              # O rasto do Gradle são 60 linhas de "at org.gradle..." e não
              # ajudam nada. Primeiro as mensagens de erro a sério.
              grep -E '^(e:|w: .*(error)|FAILURE:|\* What went wrong|> )|error:|Could not (resolve|find|GET)' \
                android_apk/build.log | head -40 || true
              echo "--- últimas linhas ---"
              grep -v '^\s*$' android_apk/build.log | grep -v 'at org.gradle' | tail -25
            else
              echo "(sem build.log: a falha ocorreu antes de correr o Gradle)"
            fi
            echo '```'
          } > "$RELATORIO"
          gh pr comment "$PR" --body-file "$RELATORIO" \
            || echo "aviso: não foi possível comentar no PR"

      # Os logs do Actions não são alcançáveis pela rede do sandbox
      # (results-receiver... → EOF). Sem isto, uma falha de compilação só se
      # via como "exit code 1". O build.log vai para o ramo apk-artifact em
      # caso de falha, que é o canal que já funciona.
      - name: Publicar o build.log quando falha
        if: failure()
        run: |
          set -uo pipefail
          LOG=android_apk/build.log
          [ -f "$LOG" ] || { echo "sem build.log"; exit 0; }
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q -b apk-log
          cp "$GITHUB_WORKSPACE/$LOG" build.log
          {
            echo "run: ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "evento: ${{ github.event_name }}"
          } > META.txt
          git add build.log META.txt
          git -c user.email=ci@automaton -c user.name=ci commit -q -m "build.log do run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-log
          echo "build.log publicado no ramo apk-log"

      - name: Resumo do build
        if: always()
        run: |
          {
            echo "## APK Automaton Holding"
            echo ""
            echo "| Variante | Ficheiro |"
            echo "|----------|----------|"
            echo "| Debug | \`dist/app-debug.apk\` |"
            if [ "${{ steps.release_ok.outputs.ok }}" = "true" ]; then
              echo "| Release (assinado) | \`dist/app-release.apk\` |"
            else
              echo "| Release | não assinado (sem keystore) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
